name: "Run H2 script"

on:
  workflow_dispatch:
  push:
    paths:
      - 'h2/**'
      - '.github/workflows/h2Run.yml'
      - 'buildSrc/src/main/groovy/groovy-setup.gradle'
      - 'build.gradle'

permissions:
  contents: read

jobs:
  execute:
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java }}
          check-latest: true
      - uses: gradle/actions/setup-gradle@v5
      - name: Run scripts with Gradle
        run: ./gradlew h2:run.h2.All
        timeout-minutes: 60

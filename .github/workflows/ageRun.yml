name: "Run Apache Age script"

on:
  workflow_dispatch:
  push:
    paths:
      - 'age/**'

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest

    services:
      age:
        image: apache/age:latest
        env:
          POSTGRES_PASSWORD: postgresPW
          POSTGRES_USER: postgresUser
          POSTGRES_DB: postgresDB
        ports:
          - 5455:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 17
          check-latest: true
      - uses: gradle/actions/setup-gradle@v4
      - name: Run scripts with Gradle
        run: ./gradlew age:runAS
        timeout-minutes: 60

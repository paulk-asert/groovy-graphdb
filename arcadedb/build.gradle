plugins {
    id 'groovy-setup'
}

var gremlinVersion = '3.8.0'
var compat21 = JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_21)
var arcadedbVersion = compat21 ? '25.12.1' : '25.3.2'

dependencies {
    implementation "com.arcadedb:arcadedb-engine:$arcadedbVersion"
    implementation "com.arcadedb:arcadedb-gremlin:$arcadedbVersion"
    implementation "com.arcadedb:arcadedb-network:$arcadedbVersion"
    /* next two dependencies only needed to access studio */
//    implementation "com.arcadedb:arcadedb-studio:$arcadedbVersion"
//    implementation "com.arcadedb:arcadedb-server:$arcadedbVersion"
    implementation "org.apache.tinkerpop:gremlin-core:$gremlinVersion"
    implementation "org.apache.tinkerpop:gremlin-util:$gremlinVersion"
    implementation "org.apache.tinkerpop:gremlin-groovy:$gremlinVersion"
    implementation "org.opencypher.gremlin:translation:1.0.4"
    runtimeOnly "org.slf4j:slf4j-simple:$slf4jVersion"
}
